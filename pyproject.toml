[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridcast"
version = "0.1.0"
description = "F1 2026 championship forecast — race distributions + Monte Carlo season simulation"
requires-python = ">=3.11"
dependencies = [
    # data ingestion
    "fastf1>=3.4",
    "requests>=2.32",
    "httpx>=0.27",
    # data wrangling
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    # config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # modelling
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    # simulation
    "tqdm>=4.66",
]

[project.optional-dependencies]
bayes = [
    "pymc>=5.15",
    "numpyro>=0.15",
    "jax>=0.4",
    "jaxlib>=0.4",
]
viz = [
    "plotly>=5.22",
    "matplotlib>=3.9",
    "streamlit>=1.35",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
