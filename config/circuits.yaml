# Metadatos de circuitos — F1 2026
# Bahrain (orig. R4) y Arabia Saudí (orig. R5) cancelados por conflicto en Oriente Medio
# Imola eliminada; debut de Madrid (Madring) en R14
# Sprint weekends (6): China R2, Miami R4, Canadá R5, Gran Bretaña R9, Países Bajos R12, Singapur R16
#
# IMPORTANTE — round_2026 y jolpica_round:
#   Son valores cacheados del estado actual del calendario (22 rondas).
#   Si Bahrain o Arabia Saudí se reinsertan, Jolpica renumerará y estos valores
#   quedarán desactualizados. El módulo ingest/schedule.py SIEMPRE debe
#   derivar los round numbers del endpoint live de Jolpica, nunca de este fichero.
#
# jolpica_id: identificador estable del circuito en la API Jolpica/Ergast.
#   Es el campo de join fiable aunque cambien los round numbers.
#
# power_sensitive: circuito donde la PU marca diferencia (rectas largas)
# downforce_level: low / medium / high
# street_circuit: semi-permanente; mayor riesgo de SC/VSC
# overtaking: easy / medium / hard
# tyre_deg: low / medium / high

